# Local Rocket.Chat dev server: `docker compose -f dev/docker-compose.yml up -d`.
# First start takes a minute or two; the service is ready when
# http://127.0.0.1:3000 responds. Create the first user through the web UI
# (it becomes the administrator), then export credentials for the client:
#   export RCHAT_USER=... RCHAT_PASSWORD=...

services:
  db:
    image: mongo:7
    restart: unless-stopped
    command: ["--replSet", "rs0", "--bindIp_all"]
    volumes:
      - mongo_data:/data/db

  mongo-init:
    image: mongo:7
    depends_on:
      - db
    restart: "no"
    entrypoint: mongo --host db --eval 'rs.initiate()'

  server:
    image: registry.rocket.chat/rocketchat/rocket.chat:7.5.0
    restart: unless-stopped
    depends_on:
      - db
      - mongo-init
    environment:
      MONGO_URL: mongodb://db:27017/rocketchat
      ROOT_URL: http://127.0.0.1:3000
      PORT: "3000"
    ports:
      - "127.0.0.1:3000:3000"

volumes:
  mongo_data:
