[package]
name = "blazer-chat"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Runtime-agnostic channels carry events and requests across the
# compio/GPUI boundary (channels, not nested executors).
async-channel = "2.5"
compio = { version = "0.19", features = ["macros", "net", "time", "native-tls"] }
# gpui migrated off the frozen 0.2.2 crates.io snapshot onto a current
# zed rev (f16f96), republished rev-matched by the bezel family: the
# lib crate keeps the `gpui` name, `bezel-gpui-platform` provides the
# Linux/Wayland backend and the `application()` bootstrap (upstream
# split gpui and its platform impl into two crates). This line carries
# the rewritten virtualizing `list`, anchored popovers and AccessKit
# a11y — none of which exist in 0.2.2. (gpui-pre 0.3.11 was evaluated
# first and rejected: its republish ships no real platform backend —
# only TestPlatform/VisualTestPlatform — so it cannot open a window.)
bezel-gpui = "=0.3.21+zed.f16f96"
# The platform crate compiles the backend: wayland explicitly (the
# surface is Wayland-native, DECL0002 — no x11/XWayland fallback).
bezel-gpui-platform = { version = "=0.3.21+zed.f16f96", features = [
    "wayland",
] }
redb = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tako-rs = { version = "2.6", default-features = false, features = ["compio"] }
unicode-segmentation = "1"
futures-lite = "2"
compio-ws = { version = "0.4", features = ["native-tls"] }
# File downloads arrive force-gzipped (server ignores Accept-Encoding).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Local-offset timestamps for the pane (system tz database).
jiff = "0.2"
# Attach button: native file dialog (GTK3 backend).
rfd = "0.18"

[dev-dependencies]
# `#[gpui::test]` fixtures: headless window + TestAppContext (m10 S5
# / m13 — the pane's regression pins run in `just gate`).
bezel-gpui = { version = "=0.3.21+zed.f16f96", features = ["test-support"] }
futures-lite = "2"

[lints]
workspace = true
