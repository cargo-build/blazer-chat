[package]
name = "rchat-blazar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Runtime-agnostic channels carry events and requests across the
# compio/GPUI boundary (channels, not nested executors).
async-channel = "2.5"
compio = { version = "0.19", features = ["macros", "net", "time", "native-tls"] }
gpui = "0.2.2"
redb = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tako-rs = { version = "2.6", default-features = false, features = ["compio"] }
unicode-segmentation = "1"
futures-lite = "2"
compio-ws = { version = "0.4", features = ["native-tls"] }
# File downloads arrive force-gzipped (server ignores Accept-Encoding).
flate2 = { version = "1", default-features = false, features = ["rust_backend"] }
# Local-offset timestamps for the pane (system tz database).
jiff = "0.2"

[dev-dependencies]
futures-lite = "2"

[lints]
workspace = true
