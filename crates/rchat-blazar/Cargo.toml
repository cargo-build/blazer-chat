[package]
name = "rchat-blazar"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
# Runtime-agnostic channels carry events and requests across the
# compio/GPUI boundary (channels, not nested executors).
async-channel = "2.5"
compio = { version = "0.19", features = ["macros", "net", "time", "native-tls"] }
gpui = "0.2.2"
redb = "4.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.9"
tako-rs = { version = "2.6", default-features = false, features = ["compio"] }
unicode-segmentation = "1"

[dev-dependencies]
futures-lite = "2"

[lints]
workspace = true
